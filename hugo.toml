baseURL = "https://note.pp.ua/"
theme = "hugo-bearblog"
title = "Duet"
languageCode = "en"
enableRobotsTXT = true

[taxonomies]
  tag = "tags"

[permalinks]
  blog = "/:slug/"
  tags = "/tags/:slug/"

[params]
  description = "Notes and travel, from Shanghai."
  title = "Duet"
  dateFormat = "02 Jan, 2006"
  hideMadeWithLine = true

[markup]
  [markup.highlight]
    style = "friendly"
    codeFences = true
    lineNos = false
